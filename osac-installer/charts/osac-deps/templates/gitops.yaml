{{- if .Values.gitops.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-gitops-operator
  annotations:
    osac.openshift.io/tenant: platform
    osac.openshift.io/owner-reference: Subscription/openshift-gitops-operator
  labels:
    openshift.io/cluster-monitoring: "true"
    {{- include "osac-deps.labels" . | nindent 4 }}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-gitops-operator
  namespace: openshift-gitops-operator
  annotations:
    osac.openshift.io/tenant: platform
    osac.openshift.io/owner-reference: Namespace/openshift-gitops-operator
  labels:
    {{- include "osac-deps.labels" . | nindent 4 }}
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-gitops-operator
  namespace: openshift-gitops-operator
  annotations:
    osac.openshift.io/tenant: platform
    osac.openshift.io/owner-reference: OperatorGroup/openshift-gitops-operator
  labels:
    {{- include "osac-deps.labels" . | nindent 4 }}
spec:
  channel: {{ .Values.gitops.channel }}
  name: openshift-gitops-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
{{- end }}
